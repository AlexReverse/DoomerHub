<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <title>Мои посты &ndash; DoomerHub</title>
    <link rel="stylesheet" th:href="@{/style.css}"/>
    <link rel="shortcut icon" type="images/png" th:href="@{/images/favicon.png}"/>
</head>
<body>
<div th:replace="~{fragments/header :: header}"></div>
<table>
    <thead>
    <tr>
        <th>&#8470</th>
        <th>Мои Посты</th>
    </tr>
    </thead>
    <tbody>
    <tr data-th-each="post : ${posts}">
        <td data-th-text="${post.id}"></td>
        <td>
            <a data-th-href="@{/search/posts/{postId}(postId=${post.id})}"
               data-th-text="${post.title}"></a>
        </td>
    </tr>
    </tbody>
</table>
</body>
</html>
