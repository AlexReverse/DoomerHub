<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <title>Редактирование поста &laquo;[[${post.title}]]&raquo; &ndash; DoomerHub</title>
    <link rel="stylesheet" th:href="@{/style.css}"/>
    <script type="text/javascript" th:src="@{/js/description_counter.js}"></script>
    <link rel="shortcut icon" type="images/png" th:href="@{/images/favicon.png}"/>
</head>
<body>
<header>
    <div class="logo">
        <a type="images/png" th:href="@{/images/favicon.png}"></a>
    </div>
    <nav>
        <ul>
            <li><a data-th-href="@{/search/posts/by-user}">Мои посты</a></li>
            <li><a data-th-href="@{/search/posts/favourites}">Избранные посты</a></li>
            <li><a data-th-href="@{/search/posts/create}">Создать пост</a></li>
            <li><a href="http://localhost:8086/main-page">Информация обо мне</a></li>
        </ul>
    </nav>
</header>
<div class="create-post-container">
    <h1>Редактирование поста &laquo;[[${post.title}]]&raquo;</h1>
    <div data-th-if="${errors}">
        <h2>Допущены ошибки</h2>
        <ul>
            <li data-th-each="error: ${errors}" data-th-text="${error}" class="error-item"></li>
        </ul>
    </div>
    <form method="post"
          data-th-action="@{/search/posts/{postId}/edit(postId=${post.id})}"
          class="create-post-form">
        <div class="form-group">
            <label for="postTitle" class="form-label">Название:</label>
            <input type="text"
                   id="postTitle"
                   class="form-input"
                   name="title"
                   data-th-value="${payload != null ? payload.title : post.title}">
        </div>
        <div class="form-group">
            <label for="postDescription" class="form-label">Описание:</label>
            <textarea id="postDescription"
                      class="form-textarea"
                      name="description"
                      rows="6"
                      maxlength="10000"
                      data-th-text="${payload != null ? payload.description : post.description}"></textarea>
            <div class="char-counter" id="charCounter">0 / 10000</div>
        </div>
        <div class="form-actions">
            <button type="submit" class="btn-primary">Изменить</button>
            <a data-th-href="@{/search/posts/{postId}(postId=${post.id})}" class="btn-secondary">Отмена</a>
        </div>
    </form>
</div>
</body>
</html>
